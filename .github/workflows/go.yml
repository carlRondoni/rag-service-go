name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go mod download
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: go build -v ./...

      - name: Run tests with coverage
        run: go test -tags=unit ./... -covermode=count -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out -o=coverage.out

      - name: Generate Coverage Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tj-actions/coverage-badge-go@v3
        with:
          filename: coverage.out
          text: coverage
      
      - name: Verify Changed files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tj-actions/verify-changed-files@v20
        id: verify-changed-files
        with:
          files: readme.md

      - name: Commit changes
        if: steps.verify-changed-files.outputs.files_changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add readme.md
          git commit -m "chore: Updated coverage badge."
          git push

  integration:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: documents
      OLLAMA_URL: http://localhost:11434

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Pull Ollama models
        run: |
          curl -sSf --max-time 900 "$OLLAMA_URL/api/pull" -d '{"model":"llama3","stream":false}'
          curl -sSf --max-time 300 "$OLLAMA_URL/api/pull" -d '{"model":"nomic-embed-text","stream":false}'

      # Loading llama3 on a CPU runner is slow and the tests have 90s timeouts.
      - name: Load llama3 into memory
        run: curl -sSf --max-time 600 "$OLLAMA_URL/api/generate" -d '{"model":"llama3","prompt":"hi","stream":false}' -o /dev/null

      - name: Start API
        run: |
          go build -o "$RUNNER_TEMP/rag-api" ./cmd/api
          nohup "$RUNNER_TEMP/rag-api" > "$RUNNER_TEMP/rag-api.log" 2>&1 &

      # -p 1 stops test packages from competing for the runner's CPU.
      - name: Run integration tests
        run: go test -v -p 1 -tags=integration ./...

      - name: Show API logs
        if: failure()
        run: cat "$RUNNER_TEMP/rag-api.log"
