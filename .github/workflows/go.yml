name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go mod download
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: go build -v ./...

      - name: Run tests with coverage
        run: go test -tags=unit ./... -covermode=count -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      # main is protected, so the badge data lives on its own branch
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          pct=${total%\%}
          color=$(awk -v p="$pct" 'BEGIN {print (p >= 70 ? "brightgreen" : p >= 50 ? "yellow" : "red")}')
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' "$total" "$color" > "$dir/coverage.json"
          git -C "$dir" init -q -b badges
          git -C "$dir" add coverage.json
          git -C "$dir" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "chore: update coverage badge"
          git -C "$dir" push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  integration:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: documents
      OLLAMA_URL: http://localhost:11434

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Pull Ollama models
        run: |
          curl -sSf --max-time 900 "$OLLAMA_URL/api/pull" -d '{"model":"llama3","stream":false}'
          curl -sSf --max-time 300 "$OLLAMA_URL/api/pull" -d '{"model":"nomic-embed-text","stream":false}'

      # slow on CPU, and the tests time out at 90s
      - name: Load llama3 into memory
        run: curl -sSf --max-time 600 "$OLLAMA_URL/api/generate" -d '{"model":"llama3","prompt":"hi","stream":false}' -o /dev/null

      - name: Start API
        run: |
          go build -o "$RUNNER_TEMP/rag-api" ./cmd/api
          nohup "$RUNNER_TEMP/rag-api" > "$RUNNER_TEMP/rag-api.log" 2>&1 &

      # one package at a time, they all hit the same CPU
      - name: Run integration tests
        run: go test -v -p 1 -tags=integration ./...

      - name: Show API logs
        if: failure()
        run: cat "$RUNNER_TEMP/rag-api.log"
